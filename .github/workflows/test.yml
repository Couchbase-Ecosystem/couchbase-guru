name: Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ============================================
  # Lint + unit tests (no network, backend mocked)
  # ============================================
  unit:
    name: Unit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Run unit tests
        run: uv run pytest tests/ -v --tb=short

  # ============================================
  # Integration tests against the live agent backend.
  # Opt-in: runs on push to main and manual dispatch, not on PRs from forks.
  # Uses the public default agent unless CB_AGENT_BASE_URL is provided.
  # ============================================
  integration:
    name: Integration (live agent)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run integration tests
        env:
          CB_MCP_RUN_INTEGRATION: "1"
          # Optional: point at a specific backend (e.g. staging). Falls back to
          # the public default when the secret is unset.
          CB_AGENT_BASE_URL: ${{ secrets.CB_AGENT_BASE_URL }}
        run: uv run pytest tests/test_docs_tools.py -v --tb=short
